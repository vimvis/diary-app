<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 기억</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS Variables ── */
    :root {
      --bg:           #F7F6F2;
      --bg2:          #EFEDE8;
      --surface:      #FFFFFF;
      --surface2:     #F2F0EB;
      --border:       rgba(0,0,0,0.08);
      --text:         #1C1C1E;
      --text2:        #6B6B6B;
      --text3:        #B0B0B0;
      --primary:      #6366F1;
      --primary-soft: rgba(99,102,241,0.12);
      --primary-glow: rgba(99,102,241,0.28);
      --accent:       #A78BFA;
      --danger:       #EF4444;
      --danger-soft:  rgba(239,68,68,0.1);
      --shadow:       0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg:    0 12px 40px rgba(0,0,0,0.12);
      --radius:       16px;
      --radius-sm:    10px;
      --nav-h:        68px;
      --header-h:     60px;
      --transition:   0.2s cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg:           #111118;
      --bg2:          #18181F;
      --surface:      #1E1E28;
      --surface2:     #252532;
      --border:       rgba(255,255,255,0.07);
      --text:         #F0F0F8;
      --text2:        #9090A8;
      --text3:        #555568;
      --primary:      #818CF8;
      --primary-soft: rgba(129,140,248,0.15);
      --primary-glow: rgba(129,140,248,0.32);
      --accent:       #C4B5FD;
      --danger:       #F87171;
      --danger-soft:  rgba(248,113,113,0.12);
      --shadow:       0 4px 20px rgba(0,0,0,0.4);
      --shadow-lg:    0 12px 40px rgba(0,0,0,0.55);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── App Shell ── */
    #app { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 50;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 11px; }
    .logo {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(135deg, #818CF8 0%, #C4B5FD 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px var(--primary-glow);
    }
    .logo svg { width: 18px; height: 18px; }
    .header-title { font-size: 0.92rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-date  { font-size: 0.7rem;  color: var(--text2); margin-top: 2px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); transform: scale(1.06); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ── Views wrapper ── */
    #views { flex: 1; }

    /* ── Main grid (home) ── */
    #home-view {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1080px; margin: 0 auto; width: 100%;
      padding-bottom: calc(var(--nav-h) + 20px);
    }
    #home-view.hidden { display: none; }

    /* ── Calendar wrapper ── */
    #cal-wrapper {
      display: none;
      padding: 20px;
      max-width: 540px; margin: 0 auto; width: 100%;
      padding-bottom: calc(var(--nav-h) + 20px);
    }
    #cal-wrapper.visible { display: block; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: background var(--transition), box-shadow var(--transition);
    }
    .section-label {
      font-size: 0.63rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--text3);
      display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
    }
    .section-label svg { width: 11px; height: 11px; }

    /* ── Date Input ── */
    .date-block { margin-bottom: 18px; }
    .date-input {
      width: 100%; padding: 11px 14px;
      background: var(--bg2); border: 1.5px solid transparent;
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all var(--transition);
      -webkit-appearance: none;
    }
    .date-input::-webkit-calendar-picker-indicator {
      opacity: 0.35; cursor: pointer;
    }
    [data-theme="dark"] .date-input::-webkit-calendar-picker-indicator {
      filter: invert(1); opacity: 0.35;
    }
    .date-input:hover  { border-color: var(--primary-glow); }
    .date-input:focus  {
      outline: none; border-color: var(--primary);
      background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* ── Memory Inputs ── */
    .fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 600; color: var(--text2); margin-bottom: 7px;
    }
    .field-num {
      width: 19px; height: 19px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary);
      font-size: 0.63rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .mem-input {
      width: 100%; padding: 11px 14px;
      background: var(--bg2); border: 1.5px solid transparent;
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 0.865rem; line-height: 1.65;
      resize: none; min-height: 70px; transition: all var(--transition);
    }
    .mem-input::placeholder { color: var(--text3); }
    .mem-input:hover  { border-color: var(--primary-glow); }
    .mem-input:focus  {
      outline: none; border-color: var(--primary);
      background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* ── Save Button ── */
    .save-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366F1 0%, #A78BFA 100%);
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: all var(--transition); position: relative; overflow: hidden;
    }
    .save-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent);
      opacity: 0; transition: opacity var(--transition);
    }
    .save-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px var(--primary-glow); }
    .save-btn:hover:not(:disabled)::after { opacity: 1; }
    .save-btn:active:not(:disabled) { transform: none; }
    .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .save-btn svg { width: 15px; height: 15px; }

    /* ── Right panel ── */
    .right-panel { display: flex; flex-direction: column; gap: 14px; }

    /* ── Entry Cards ── */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: fadeUp 0.35s ease both;
      transition: box-shadow var(--transition);
    }
    .entry-card:hover { box-shadow: var(--shadow-lg); }
    .entry-header {
      padding: 13px 16px 11px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .entry-meta { display: flex; align-items: center; gap: 9px; }
    .badge {
      padding: 3px 9px; border-radius: 100px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.03em;
    }
    .badge-today { background: var(--primary); color: #fff; }
    .badge-past  {
      background: var(--surface2); color: var(--text2);
      border: 1px solid var(--border);
    }
    .entry-date-str { font-size: 0.8rem; color: var(--text2); font-weight: 500; }
    .del-btn {
      width: 30px; height: 30px; border-radius: 8px;
      border: none; background: transparent; color: var(--text3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: all var(--transition);
    }
    .entry-card:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .del-btn svg { width: 13px; height: 13px; }
    .entry-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
    .entry-row { display: flex; gap: 11px; align-items: flex-start; }
    .entry-n {
      width: 21px; height: 21px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary);
      font-size: 0.63rem; font-weight: 700; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
    }
    .past-card .entry-n { background: var(--surface2); color: var(--text2); }
    .entry-text { font-size: 0.858rem; line-height: 1.65; color: var(--text); flex: 1; }

    /* ── Empty State ── */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 32px 20px; text-align: center;
    }
    .empty-ico {
      width: 56px; height: 56px; border-radius: 18px;
      background: var(--primary-soft);
      display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
    }
    .empty-ico svg { width: 26px; height: 26px; color: var(--primary); }
    .empty-title { font-size: 0.9rem; font-weight: 600; color: var(--text2); }
    .empty-desc  { font-size: 0.78rem; color: var(--text3); line-height: 1.6; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--surface) 50%, var(--surface2) 75%);
      background-size: 200%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }

    /* ── Calendar ── */
    .cal-card { padding: 20px; }
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
    }
    .cal-month { font-size: 1rem; font-weight: 700; }
    .cal-arrow {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
    }
    .cal-arrow:hover { background: var(--surface2); color: var(--text); }
    .cal-arrow svg { width: 15px; height: 15px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-hdr {
      text-align: center; font-size: 0.67rem; font-weight: 600;
      color: var(--text3); padding: 6px 0; letter-spacing: 0.05em;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; cursor: pointer; position: relative;
      color: var(--text2); transition: all var(--transition);
    }
    .cal-day:hover:not(.empty) { background: var(--surface2); color: var(--text); }
    .cal-day.today  { background: var(--primary); color: #fff; font-weight: 700; }
    .cal-day.today:hover { background: var(--accent); }
    .cal-day.has-entry::after {
      content: ''; position: absolute; bottom: 3px; left: 50%;
      transform: translateX(-50%); width: 3.5px; height: 3.5px;
      border-radius: 50%; background: var(--primary);
    }
    .cal-day.today.has-entry::after { background: rgba(255,255,255,0.75); }
    .cal-day.dim { color: var(--text3); opacity: 0.38; }
    .cal-day.empty { cursor: default; }

    /* ── Bottom Nav ── */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h); z-index: 50;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 20px; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1; max-width: 110px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 9px 8px; border-radius: var(--radius-sm);
      cursor: pointer; transition: all var(--transition);
      border: none; background: transparent; color: var(--text3);
      font-family: inherit;
    }
    .nav-btn.active { color: var(--primary); background: var(--primary-soft); }
    .nav-btn:hover:not(.active) { color: var(--text2); background: var(--surface2); }
    .nav-btn svg { width: 21px; height: 21px; stroke-width: 1.75; }
    .nav-btn span { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--text); color: var(--bg);
      padding: 9px 18px; border-radius: 100px;
      font-size: 0.8rem; font-weight: 500;
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: all 0.28s ease; z-index: 200;
      box-shadow: var(--shadow-lg);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Spinner ── */
    .spin {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      animation: rotate 0.65s linear infinite; display: inline-block;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes rotate { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      #home-view { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
      header { padding: 0 14px; }
      nav { padding: 0 14px; padding-bottom: env(safe-area-inset-bottom); }
    }
    #save-status { font-size: .75rem; color: var(--text2); min-height: 2.5em; margin-bottom: 12px; line-height: 1.6; }
    .backup-btn { margin-left: auto; margin-right: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; font: inherit; font-size: .72rem; }
    button.cal-day { font: inherit; border: 0; background: transparent; color: var(--text); }
    button.cal-day.today { background: var(--primary-soft); color: var(--primary); }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    @media(max-width:720px) { #home-view { padding-bottom: calc(var(--nav-h) + 30px + env(safe-area-inset-bottom)); } .header-title { font-size: .75rem; } }
    @media(prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    .date-navigation { display: flex; gap: 8px; align-items: center; }
    .date-navigation input { min-width: 0; flex: 1; width: 100%; }
    .utility-btn { min-height: 44px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); color: var(--text); font: inherit; cursor: pointer; }
    .date-navigation .utility-btn { font-size: 1.5rem; min-width: 44px; }
    .date-context, .editor-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text2); font-size: .75rem; }
    .date-context { margin-top: 8px; }
    .editor-summary { margin: 4px 0 12px; flex-wrap: wrap; }
    .text-btn { min-height: 44px; padding: 6px 8px; background: transparent; border: 0; color: var(--primary); cursor: pointer; font: inherit; }
    .editor-hint { color: var(--text2); font-size: .72rem; line-height: 1.7; margin-top: 10px; text-align: center; }
    .editor-hint span { display: block; }
    .record-tools { margin-top: 16px; scroll-margin-top: 80px; }
    .record-tools summary { font-weight: 600; cursor: pointer; min-height: 28px; }
    .record-tools p { font-size: .75rem; line-height: 1.8; color: var(--text2); margin: 10px 0; overflow-wrap: anywhere; }
    .record-tools .utility-btn { width: 100%; margin: 4px 0 16px; }
    .import-label { display: block; font-size: .8rem; margin-bottom: 8px; }
    #import-file { max-width: 100%; font: inherit; font-size: .75rem; color: var(--text2); }
    #import-file::file-selector-button { min-height: 44px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-right: 8px; }
    .retry-btn { margin-top: 12px; width: 100%; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      #home-view { padding-bottom: calc(var(--nav-h) + 110px + env(safe-area-inset-bottom)); }
      .save-btn:disabled { opacity: 1; background: var(--surface2); color: var(--text2); }
      .save-btn { position: fixed; left: 28px; right: 28px; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); width: calc(100% - 56px); z-index: 45; box-shadow: 0 0 0 10px var(--bg), var(--shadow-lg); }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header>
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div>
        <div class="header-title">나의 기억이 나의 삶</div>
        <div class="header-date" id="hdr-date"></div>
      </div>
    </div>
    <button class="backup-btn" id="manage-btn" aria-controls="record-tools" aria-expanded="false">기록 관리</button>
    <button class="icon-btn" id="theme-btn" aria-label="화면 테마 변경" title="테마">
      <!-- sun (shown in dark mode) -->
      <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- moon (shown in light mode) -->
      <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- ── Views ── -->
  <div id="views">

    <!-- Home View -->
    <div id="home-view">

      <!-- LEFT: Form -->
      <div>
        <div class="card">
          <!-- Date -->
          <div class="date-block">
            <div class="section-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              날짜 선택
            </div>
            <div class="date-navigation">
              <button class="utility-btn" id="day-prev" aria-label="이전 날짜">‹</button>
              <input type="date" class="date-input" id="date-input" aria-label="기록 날짜" />
              <button class="utility-btn" id="day-next" aria-label="다음 날짜">›</button>
            </div>
            <div class="date-context"><span id="selected-date-label"></span><button class="text-btn" id="go-today">오늘로</button></div>
          </div>

          <!-- Memories -->
          <p id="save-status" role="status" aria-live="polite"></p>
          <div class="fields">
            <div>
              <label for="item1" class="field-label"><span class="field-num">1</span> 첫 번째 기억</label>
              <textarea class="mem-input" id="item1" placeholder="오늘 감사했던 일은?" rows="3"></textarea>
            </div>
            <div>
              <label for="item2" class="field-label"><span class="field-num">2</span> 두 번째 기억</label>
              <textarea class="mem-input" id="item2" placeholder="오늘 배운 것은?" rows="3"></textarea>
            </div>
            <div>
              <label for="item3" class="field-label"><span class="field-num">3</span> 세 번째 기억</label>
              <textarea class="mem-input" id="item3" placeholder="내일 하고 싶은 일은?" rows="3"></textarea>
            </div>
          </div>

          <div class="editor-summary"><span id="writing-progress"></span><button class="text-btn" id="discard-draft" disabled>임시 저장 취소</button></div>
          <!-- Save -->
          <button class="save-btn" id="save-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            <span id="save-label">일기 저장하기</span>
          </button>
          <p class="editor-hint">한 가지 기억만 적어도 괜찮아요. <span>⌘ / Ctrl + Enter로 저장</span></p>
          <button class="utility-btn retry-btn" id="retry-load" hidden>다시 불러오기</button>
        </div>
        <details id="record-tools" class="card record-tools">
          <summary>기록 관리</summary>
          <p>저장된 일기와 이 브라우저의 초안을 파일로 보관하세요.</p>
          <button class="utility-btn" id="backup-btn">백업 다운로드</button>
          <label class="import-label" for="import-file">백업 파일 가져오기</label>
          <input id="import-file" type="file" accept=".json,application/json" aria-describedby="import-help" />
          <p id="import-help">가져온 기록은 날짜별 임시 저장으로 복원합니다. 기존 초안은 유지하며, 저장 버튼을 눌러야 일기에 반영돼요.</p>
          <p id="import-status" role="status" aria-live="polite"></p>
        </details>
      </div>

      <!-- RIGHT: Memories -->
      <div class="right-panel">
        <div id="sk-loader">
          <div class="card" style="display:flex;flex-direction:column;gap:12px">
            <div class="sk" style="height:18px;width:35%"></div>
            <div class="sk" style="height:13px"></div>
            <div class="sk" style="height:13px;width:80%"></div>
            <div class="sk" style="height:13px;width:60%"></div>
          </div>
        </div>
        <div id="mem-content"></div>
      </div>

    </div><!-- /home-view -->

    <!-- Calendar View -->
    <div id="cal-wrapper">
      <div class="card cal-card">
        <div class="cal-nav">
          <button class="cal-arrow" id="cal-prev" aria-label="이전 달">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="cal-month" id="cal-label"></span>
          <button class="cal-arrow" id="cal-next" aria-label="다음 달">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

  </div><!-- /views -->

  <!-- ── Bottom Nav ── -->
  <nav>
    <button class="nav-btn active" id="nav-home" onclick="goToday()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>오늘</span>
    </button>
    <button class="nav-btn" id="nav-cal" onclick="switchView('cal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>달력</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div><!-- /app -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, query, orderBy, getDocs, where, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ── Firebase ── */
const db = getFirestore(initializeApp({
  apiKey:            "AIzaSyBHxd2JnEl-EuMWZGSHfaSKJtZ5Lsg24Dg",
  authDomain:        "daily-dairy-c6e5a.firebaseapp.com",
  projectId:         "daily-dairy-c6e5a",
  storageBucket:     "daily-dairy-c6e5a.firebasestorage.app",
  messagingSenderId: "888823431115",
  appId:             "1:888823431115:web:e1d429ca9b7aae0e56804e"
}));
const COL = "entries";

/* ── Helpers ── */
const toStr = d => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const shortKo = s => {
  const [y,m,d] = s.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일`;
};
const escHtml = s => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') : '';

/* ── State ── */
let savedValues = {item1:'', item2:'', item3:''}, entryExists = false;
let loadVersion = 0, calendarVersion = 0, loading = false, busy = false;
let curDate = toStr(new Date());
let calY = new Date().getFullYear(), calM = new Date().getMonth();

/* ── Header date ── */
(() => {
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('hdr-date').textContent =
    `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
})();

/* ── Date input ── */
const dateEl = document.getElementById('date-input');
dateEl.value = curDate;
dateEl.max = toStr(new Date());
dateEl.addEventListener('change', () => {
  if (busy || !validDate(dateEl.value) || dateEl.value > toStr(new Date())) { dateEl.value = curDate; return; }
  selectDate(dateEl.value);
});
const fields = ['item1','item2','item3'];
const status = document.getElementById('save-status');
const draftKey = d => `diary-draft:${d}`;
function validDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d) && toStr(new Date(`${d}T12:00:00`)) === d; }
function readDraft(d) {
  try { const v = JSON.parse(localStorage.getItem(draftKey(d))); return v && fields.every(k => typeof v[k] === 'string') ? v : null; }
  catch { return null; }
}
function persistDraft() {
  const data = Object.fromEntries(fields.map(k => [k, document.getElementById(k).value]));
  try { localStorage.setItem(draftKey(curDate), JSON.stringify(data)); status.textContent = '이 브라우저에 임시 저장됨 · 다른 기기에는 반영되지 않아요'; }
  catch { status.textContent = '임시 저장 실패 · 일기 저장 또는 백업을 해주세요'; }
}
fields.forEach(k => document.getElementById(k).addEventListener('input', () => { persistDraft(); updateEditor(); }));
function updateEditor() {
  const values = fields.map(k => document.getElementById(k).value);
  const changed = fields.some((k,i) => values[i].trim() !== savedValues[k].trim());
  const count = values.filter(v => v.trim()).length;
  document.getElementById('writing-progress').textContent = `${count}/3개의 기억 · ${values.reduce((n,v) => n + Array.from(v).length, 0)}자`;
  document.getElementById('save-btn').disabled = loading || busy || !count || !changed;
  if (!busy) document.getElementById('save-label').textContent = changed ? (entryExists ? '변경 내용 저장' : '일기 저장하기') : (entryExists ? '저장된 일기' : '일기 저장하기');
  document.getElementById('discard-draft').disabled = loading || busy || !readDraft(curDate);
  document.getElementById('day-prev').disabled = busy;
  document.getElementById('day-next').disabled = busy || curDate >= toStr(new Date());
  document.getElementById('go-today').disabled = busy || curDate === toStr(new Date());
  document.getElementById('selected-date-label').textContent = curDate === toStr(new Date()) ? '오늘의 기억' : `${shortKo(curDate)}의 기억`;
}
function selectDate(date) {
  if (busy || !validDate(date) || date > toStr(new Date())) return;
  curDate = date; dateEl.value = date; dateEl.max = toStr(new Date());
  loadMem(date);
}
function stepDay(amount) {
  const day = new Date(`${curDate}T12:00:00`); day.setDate(day.getDate() + amount);
  selectDate(toStr(day));
}
document.getElementById('day-prev').addEventListener('click', () => stepDay(-1));
document.getElementById('day-next').addEventListener('click', () => stepDay(1));
window.goToday = () => { switchView('home'); selectDate(toStr(new Date())); };
document.getElementById('go-today').addEventListener('click', window.goToday);
document.getElementById('retry-load').addEventListener('click', () => loadMem(curDate));
document.getElementById('discard-draft').addEventListener('click', () => {
  if (loading || busy || !confirm('이 날짜의 임시 저장을 취소하고 마지막 저장 내용으로 돌아갈까요?')) return;
  try {
    localStorage.removeItem(draftKey(curDate));
    fields.forEach(k => document.getElementById(k).value = savedValues[k]);
    status.textContent = '마지막 저장 내용으로 돌아왔어요'; updateEditor();
  } catch { toast('임시 저장을 취소하지 못했어요'); }
});
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && document.getElementById('home-view').style.display !== 'none') {
    e.preventDefault(); const button = document.getElementById('save-btn'); if (!button.disabled) button.click();
  }
});
const toolsPanel = document.getElementById('record-tools');
document.getElementById('manage-btn').addEventListener('click', () => {
  switchView('home'); toolsPanel.open = !toolsPanel.open;
  if (toolsPanel.open) toolsPanel.scrollIntoView({block:'nearest'});
});
toolsPanel.addEventListener('toggle', () => document.getElementById('manage-btn').setAttribute('aria-expanded', String(toolsPanel.open)));

function lockForm(value) {
  loading = value;
  fields.forEach(k => document.getElementById(k).disabled = value || busy);
  updateEditor();
}
window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });


/* ── Theme ── */
const html = document.documentElement;
const theme = localStorage.getItem('theme') || 'dark';
html.setAttribute('data-theme', theme);
setThemeIcon(theme);

document.getElementById('theme-btn').addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  setThemeIcon(next);
});
function setThemeIcon(t) {
  document.getElementById('ico-sun').style.display  = t === 'dark'  ? 'block' : 'none';
  document.getElementById('ico-moon').style.display = t === 'light' ? 'block' : 'none';
}

/* ── Firestore ── */
async function getEntry(d)  {
  const s = await getDoc(doc(db, COL, d));
  return s.exists() ? s.data() : null;
}
async function saveEntry(data) {
  const now = new Date().toISOString();
  const ref = doc(db, COL, data.date);
  const s = await getDoc(ref);
  await setDoc(ref, { ...data, created_at: s.exists() ? s.data().created_at : now, updated_at: now });
}
async function delEntry(d) { await deleteDoc(doc(db, COL, d)); }

let earliestYearPromise;
async function getMems(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  if (!earliestYearPromise) earliestYearPromise = getDocs(query(collection(db, COL), orderBy('date'), limit(1)))
    .then(s => s.docs.length ? Number(s.docs[0].id.slice(0,4)) : y)
    .catch(e => { earliestYearPromise = null; throw e; });
  const earliest = await earliestYearPromise;
  const years = Array.from({length: Math.max(0, y - earliest)}, (_, i) => y-i-1);
  const out = [];
  // Bound concurrent reads, fetching only the anniversary documents.
  for (let offset = 0; offset < years.length; offset += 10) {
    const batch = await Promise.all(years.slice(offset, offset+10).map(async year => {
      const past = `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (!validDate(past)) return null;
      const entry = await getEntry(past);
      return entry ? {ago:y-year, date:past, entry} : null;
    }));
    out.push(...batch.filter(Boolean));
  }
  return out;
}

async function getMonthDays(year, month) {
  const pre = `${year}-${String(month+1).padStart(2,'0')}`;
  const q = query(collection(db, COL), where('date','>=',`${pre}-01`), where('date','<=',`${pre}-31`), orderBy('date'));
  const snap = await getDocs(q);
  return new Set(snap.docs.map(d => parseInt(d.id.split('-')[2])));
}

/* ── Toast ── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

/* ── Load Memories ── */
async function loadMem(dateStr) {
  const version = ++loadVersion;
  lockForm(true);
  document.getElementById('retry-load').hidden = true;
  const draft = readDraft(dateStr);
  fields.forEach(k => document.getElementById(k).value = draft?.[k] || '');
  status.textContent = draft ? '이 브라우저의 임시 저장을 복원했어요' : '불러오는 중…';
  updateEditor();
  try {
  const sk = document.getElementById('sk-loader');
  const content = document.getElementById('mem-content');
  sk.style.display = 'block'; content.innerHTML = '';

  const [today, mems] = await Promise.all([getEntry(dateStr), getMems(dateStr)]);
  if (version !== loadVersion || dateStr !== curDate) return;
  sk.style.display = 'none';

  savedValues = Object.fromEntries(fields.map(k => [k, typeof today?.[k] === 'string' ? today[k] : '']));
  entryExists = Boolean(today);
  // populate form
  document.getElementById('item1').value = draft?.item1 ?? today?.item1 ?? '';
  document.getElementById('item2').value = draft?.item2 ?? today?.item2 ?? '';
  document.getElementById('item3').value = draft?.item3 ?? today?.item3 ?? '';

  status.textContent = draft ? '임시 저장을 복원했어요 · 저장 버튼으로 일기에 반영하세요' : (today ? '저장된 일기예요 · 수정하면 임시 저장됩니다' : '오늘의 작은 기억을 남겨보세요');
  let html = '';

  // Today card
  if (today) {
    const items = [today.item1, today.item2, today.item3];
    html += `
      <div class="entry-card" style="animation-delay:0ms">
        <div class="entry-header">
          <div class="entry-meta">
            <span class="badge badge-today">${dateStr === toStr(new Date()) ? '오늘' : '선택한 날'}</span>
            <span class="entry-date-str">${shortKo(dateStr)}</span>
          </div>
          <button class="del-btn" data-del="${dateStr}" title="삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
        <div class="entry-body">
          ${items.map((t,i) => t ? `
            <div class="entry-row">
              <span class="entry-n">${i+1}</span>
              <p class="entry-text">${escHtml(t)}</p>
            </div>` : '').join('')}
        </div>
      </div>`;
  } else {
    html += `
      <div class="card" style="animation:fadeUp .35s ease both">
        <div class="empty">
          <div class="empty-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </div>
          <div class="empty-title">아직 기록이 없어요</div>
          <div class="empty-desc">오늘의 소중한 기억을<br>입력란에 적어보세요 ✍️</div>
        </div>
      </div>`;
  }

  // Past memories
  if (mems.length > 0) {
    mems.forEach((mem, idx) => {
      const items = [mem.entry.item1, mem.entry.item2, mem.entry.item3];
      html += `
        <div class="entry-card past-card" style="animation-delay:${(idx+1)*70}ms">
          <div class="entry-header">
            <div class="entry-meta">
              <span class="badge badge-past">${mem.ago}년 전 오늘</span>
              <span class="entry-date-str">${shortKo(mem.date)}</span>
            </div>
          </div>
          <div class="entry-body">
            ${items.map((t,i) => t ? `
              <div class="entry-row">
                <span class="entry-n">${i+1}</span>
                <p class="entry-text">${escHtml(t)}</p>
              </div>` : '').join('')}
          </div>
        </div>`;
    });
  } else if (today) {
    html += `
      <div class="card" style="animation:fadeUp .35s ease .18s both">
        <div class="empty" style="padding:22px 20px">
          <span style="font-size:1.8rem">⏳</span>
          <div class="empty-title" style="margin-top:4px">과거 기록이 쌓이면</div>
          <div class="empty-desc">꾸준히 작성하면 1년 후, 2년 후…<br>소중한 추억을 되새길 수 있어요</div>
        </div>
      </div>`;
  }

  content.innerHTML = html;

  // Delete handlers
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (busy || !confirm('이 일기를 삭제하시겠습니까? 삭제 전 백업을 권장해요.')) return;
      busy = true; lockForm(true); dateEl.disabled = true;
      try { await delEntry(btn.dataset.del); localStorage.removeItem(draftKey(btn.dataset.del)); earliestYearPromise = null; toast('삭제되었어요'); }
      catch { toast('삭제 중 오류가 발생했어요'); }
      finally { busy = false; dateEl.disabled = false; loadMem(curDate); }
    });
  });
  } catch {
    if (version !== loadVersion) return;
    document.getElementById('sk-loader').style.display = 'none';
    status.textContent = '불러오지 못했어요. 임시 저장은 유지됩니다.';
    document.getElementById('retry-load').hidden = false;
    document.getElementById('mem-content').textContent = '연결 상태를 확인해주세요.';
    // Existing server content is unknown: do not allow an accidental overwrite.
    return;
  } finally {
    if (version === loadVersion && document.getElementById('sk-loader').style.display === 'none' && status.textContent.indexOf('불러오지 못') !== 0) lockForm(false);
  }
}

/* ── Save ── */
document.getElementById('save-btn').addEventListener('click', async () => {
  if (loading || busy) return;
  const saveDate = curDate;
  const [i1, i2, i3] = ['item1','item2','item3'].map(id => document.getElementById(id).value.trim());
  if (!i1 && !i2 && !i3) { toast('최소 하나의 기억을 입력해주세요'); return; }
  const btn = document.getElementById('save-btn');
  const lbl = document.getElementById('save-label');
  busy = true; lockForm(true); dateEl.disabled = true;
  btn.disabled = true; lbl.innerHTML = '<span class="spin"></span>';
  try {
    await saveEntry({ date: saveDate, item1: i1, item2: i2, item3: i3 });
    localStorage.removeItem(draftKey(saveDate));
    earliestYearPromise = null;
    toast('일기가 저장되었어요 ✓');
  } catch { toast('저장 중 오류가 발생했어요'); }
  finally { busy = false; dateEl.disabled = false; lbl.textContent = '일기 저장하기'; await loadMem(saveDate); }
});

/* ── Calendar ── */
async function renderCal() {
  const version = ++calendarVersion, year = calY, month = calM;
  try {
  document.getElementById('cal-label').textContent = `${calY}년 ${calM+1}월`;
  const entryDays = await getMonthDays(year, month);
  if (version !== calendarVersion) return;
  const todayStr  = toStr(new Date());
  const firstDay  = new Date(calY, calM, 1).getDay();
  const totalDays = new Date(calY, calM+1, 0).getDate();
  const prevTotal = new Date(calY, calM, 0).getDate();
  const HEADS     = ['일','월','화','수','목','금','토'];

  let out = HEADS.map(h => `<div class="cal-hdr">${h}</div>`).join('');

  for (let i = firstDay - 1; i >= 0; i--)
    out += `<div class="cal-day dim">${prevTotal - i}</div>`;

  for (let d = 1; d <= totalDays; d++) {
    const ds = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-day', ds===todayStr?'today':'', entryDays.has(d)?'has-entry':''].filter(Boolean).join(' ');
    out += `<button type="button" class="${cls}" data-ds="${ds}" aria-label="${shortKo(ds)}${entryDays.has(d) ? ' 기록 있음' : ''}" ${ds > todayStr ? 'disabled' : ''}>${d}</button>`;
  }

  const total = firstDay + totalDays;
  const fill  = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= fill; d++) out += `<div class="cal-day dim">${d}</div>`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = out;
  grid.querySelectorAll('[data-ds]').forEach(el => {
    el.addEventListener('click', () => {
      if (busy || el.dataset.ds > toStr(new Date())) return;
      switchView('home');
      selectDate(el.dataset.ds);
    });
  });
  } catch { if (version === calendarVersion) { document.getElementById('cal-grid').textContent = '달력을 불러오지 못했어요. 이전·다음 달 버튼으로 다시 시도하세요.'; } }
}

document.getElementById('cal-prev').addEventListener('click', () => {
  if (--calM < 0) { calM = 11; calY--; } renderCal();
});
document.getElementById('cal-next').addEventListener('click', () => {
  if (++calM > 11) { calM = 0; calY++; } renderCal();
});

/* ── View Switch ── */
window.switchView = (v) => {
  const home  = document.getElementById('home-view');
  const cal   = document.getElementById('cal-wrapper');
  const btnH  = document.getElementById('nav-home');
  const btnC  = document.getElementById('nav-cal');
  if (v === 'home') {
    home.style.display = 'grid'; cal.style.display = 'none';
    btnH.classList.add('active'); btnC.classList.remove('active');
  } else {
    home.style.display = 'none'; cal.style.display = 'block';
    btnH.classList.remove('active'); btnC.classList.add('active');
    renderCal();
  }
};

/* Backup includes server entries and this browser's unsaved drafts. */
document.getElementById('backup-btn').addEventListener('click', async () => {
  const button = document.getElementById('backup-btn');
  button.disabled = true;
  try {
    const snap = await getDocs(query(collection(db, COL), orderBy('date')));
    const entries = snap.docs.map(d => ({...d.data(), date:d.id}));
    const drafts = {};
    for (let i=0; i<localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key?.startsWith('diary-draft:')) { const date = key.slice(12); const value = readDraft(date); if (value) drafts[date] = value; }
    }
    const blob = new Blob([JSON.stringify({format:'today-memories',version:1,exportedAt:new Date().toISOString(),entries,drafts},null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `memories-${toStr(new Date())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('백업 파일을 만들었어요');
  } catch { toast('백업 실패 · 연결 상태를 확인하고 다시 시도해주세요'); }
  finally { button.disabled = false; }
});

// Imports stay local until the user explicitly saves each date.
function importBackup(data) {
  if (!data || data.format !== 'today-memories' || data.version !== 1 || !Array.isArray(data.entries) || !data.drafts || typeof data.drafts !== 'object' || Array.isArray(data.drafts)) throw Error('이 앱에서 만든 백업 파일을 선택해주세요.');
  if (data.entries.length + Object.keys(data.drafts).length > 20000) throw Error('백업 기록이 너무 많아요.');
  const candidates = new Map();
  function add(date, entry) {
    if (!validDate(date) || date > toStr(new Date())) throw Error('올바르지 않은 날짜가 포함되어 있어요.');
    if (!entry || !fields.every(k => typeof entry[k] === 'string' && entry[k].length <= 100000)) throw Error('백업의 일기 내용을 확인해주세요.');
    candidates.set(date, Object.fromEntries(fields.map(k => [k, entry[k]])));
  }
  data.entries.forEach(e => add(e?.date, e));
  Object.entries(data.drafts).forEach(([date,entry]) => add(date,entry));
  const added = []; let skipped = 0;
  try {
    for (const [date, entry] of candidates) {
      if (localStorage.getItem(draftKey(date)) !== null) { skipped++; continue; }
      localStorage.setItem(draftKey(date), JSON.stringify(entry)); added.push(date);
    }
  } catch {
    added.forEach(date => localStorage.removeItem(draftKey(date)));
    throw Error('브라우저 저장 공간이 부족해 가져오지 못했어요.');
  }
  return {imported:added.length, skipped, dates:added.sort()};
}
document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files?.[0]; if (!file) return;
  const message = document.getElementById('import-status');
  if (busy || loading) { message.textContent = '불러오기나 저장이 끝난 뒤 다시 선택해주세요.'; e.target.value = ''; return; }
  try {
    if (file.size > 10 * 1024 * 1024) throw Error('10MB 이하의 백업 파일을 선택해주세요.');
    const data = JSON.parse(await file.text());
    // A date change during file reading must not replace an in-progress editor.
    if (busy || loading) throw Error('불러오기나 저장이 끝난 뒤 다시 선택해주세요.');
    const result = importBackup(data);
    message.textContent = `${result.imported}일의 기록을 임시 저장으로 가져왔어요. 기존 초안 ${result.skipped}일은 유지했어요.`;
    if (result.imported) {
      message.textContent += ` ${shortKo(result.dates[0])}부터 ${shortKo(result.dates[result.dates.length-1])}까지 날짜를 선택해 확인하세요.`;
      await loadMem(curDate);
    }
  } catch (error) { message.textContent = error instanceof SyntaxError ? 'JSON 백업 파일을 읽을 수 없어요.' : error.message; }
  finally { e.target.value = ''; }
});

/* ── Boot ── */
loadMem(curDate);
</script>
